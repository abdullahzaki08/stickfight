<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Over - You Lost!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: shake 0.5s infinite;
        }

        .photo-container {
            border: 10px solid white;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
            max-width: 80%;
            max-height: 70%;
            overflow: hidden;
            transform: scale(0);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, shake 0.5s infinite 0.5s;
        }

        @keyframes popIn {
            to {
                transform: scale(1);
            }
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }

        button {
            margin-top: 30px;
            padding: 10px 30px;
            font-size: 1.2rem;
            background: white;
            color: black;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        @keyframes shake {
            0% {
                transform: translate(1px, 1px) rotate(0deg);
            }

            10% {
                transform: translate(-1px, -2px) rotate(-1deg);
            }

            20% {
                transform: translate(-3px, 0px) rotate(1deg);
            }

            30% {
                transform: translate(3px, 2px) rotate(0deg);
            }

            40% {
                transform: translate(1px, -1px) rotate(1deg);
            }

            50% {
                transform: translate(-1px, 2px) rotate(-1deg);
            }

            60% {
                transform: translate(-3px, 1px) rotate(0deg);
            }

            70% {
                transform: translate(3px, 1px) rotate(-1deg);
            }

            80% {
                transform: translate(-1px, -1px) rotate(1deg);
            }

            90% {
                transform: translate(1px, 2px) rotate(0deg);
            }

            100% {
                transform: translate(1px, -2px) rotate(-1deg);
            }
        }
    </style>
</head>

<body>
    <h1>GAME OVER</h1>
    <div class="photo-container">
        <!-- Assuming the user saved the image as loser.png -->
        <img src="loser.png" alt="Loser Photo"
            onerror="this.src='https://via.placeholder.com/800x600?text=Loser+Photo+Not+Found'">
    </div>
    <button onclick="window.location.href='index.html'">Try Again</button>
</body>

</html>
